name: Nova Bank - Snyk Security Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install app dependencies
        run: npm install

      - name: Install Snyk CLI
        run: npm i -g snyk

      - name: Authenticate Snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk auth "$SNYK_TOKEN"

      - name: Snyk test (block high and critical issues)
        run: snyk test --severity-threshold=high
        continue-on-error: true

      - name: Snyk monitor (send to dashboard with ownership tags)
        if: github.event_name != 'pull_request'
        run: >
          snyk monitor
          --project-name=payments-team/nova-mobile-api
          --project-business-criticality=critical
          --project-environment=backend,external
          --project-lifecycle=production
          --project-tags=team=payments,owner=payments-lead

      - name: Create HTML report
        continue-on-error: true
        run: |
          npm install snyk-to-html -g
          snyk test --json | snyk-to-html -o result.html

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: snyk-report
          path: result.html
